name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Aceitar licencas do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Compilar APK
        run: |
          ARQ=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n 1)
          if [ -z "$ARQ" ]; then
            echo "ERRO: settings.gradle.kts nao foi encontrado no repositorio. Envie os arquivos do projeto."
            ls -R | head -50
            exit 1
          fi
          DIR=$(dirname "$ARQ")
          echo "Projeto encontrado em: $DIR"
          cd "$DIR"
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: espelho-carro-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
